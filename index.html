<style>
/* ==========================================================================
   EverythingAI — VSL / booking landing page
   ========================================================================== */
:root{
  --bg:#04060D;
  --surface:#0B1120;
  --surface-2:#101A2E;
  --border:#1C2942;
  --text:#F5F7FB;
  --text-muted:#96A4C0;
  --text-faint:#63739A;

  --blue:#2F8CFF;
  --blue-light:#6FC3FF;
  --blue-dark:#1657C4;

  --font-head:'Space Grotesk','Segoe UI',sans-serif;
  --font-body:'DM Sans','Segoe UI',sans-serif;
  --radius:18px;
  --ease:cubic-bezier(.22,.61,.36,1);
}

*,*::before,*::after{box-sizing:border-box;}
html{
  scroll-behavior:smooth;
  background:var(--bg);
  /* Scrollbar hidden, scrolling itself untouched — wheel, trackpad, touch,
     keyboard and the anchor buttons all still work. */
  scrollbar-width:none;
  -ms-overflow-style:none;
}
html::-webkit-scrollbar, body::-webkit-scrollbar{width:0; height:0; display:none;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.6;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%; display:block;}
a{color:inherit;}

/* --------------------------------------------------------------------------
   Glowing blue background — fixed patches + faint perspective grid
   -------------------------------------------------------------------------- */
.bg-layer{
  position:fixed; inset:0; z-index:-2; pointer-events:none;
  background:
    radial-gradient(58% 42% at 50% 6%,  rgba(47,140,255,.30) 0%, rgba(47,140,255,0) 70%),
    radial-gradient(42% 32% at 90% 28%, rgba(23,90,220,.24)  0%, rgba(23,90,220,0)  70%),
    radial-gradient(46% 34% at 6%  60%, rgba(88,40,190,.20)  0%, rgba(88,40,190,0)  72%),
    radial-gradient(62% 42% at 50% 96%, rgba(47,140,255,.22) 0%, rgba(47,140,255,0) 70%),
    var(--bg);
}
.bg-pulse{
  position:fixed; inset:-20%; z-index:-2; pointer-events:none;
  background:
    radial-gradient(28% 22% at 22% 26%, rgba(60,150,255,.16) 0%, rgba(60,150,255,0) 70%),
    radial-gradient(26% 20% at 78% 72%, rgba(47,140,255,.14) 0%, rgba(47,140,255,0) 70%);
  animation:drift 26s var(--ease) infinite alternate;
}
@keyframes drift{
  from{transform:translate3d(-2%,-1%,0) scale(1);}
  to  {transform:translate3d(3%,2%,0)   scale(1.12);}
}
/* Perspective grid floor, like the brand banners */
.bg-grid{
  position:fixed; left:-25%; right:-25%; bottom:0; height:58vh; z-index:-2;
  pointer-events:none; opacity:.28;
  background-image:
    linear-gradient(to right, rgba(90,160,255,.30) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(90,160,255,.22) 1px, transparent 1px);
  background-size:70px 70px;
  transform:perspective(340px) rotateX(66deg);
  transform-origin:bottom center;
  -webkit-mask-image:linear-gradient(to top, #000 0%, rgba(0,0,0,.35) 45%, transparent 85%);
          mask-image:linear-gradient(to top, #000 0%, rgba(0,0,0,.35) 45%, transparent 85%);
}
.bg-vignette{
  position:fixed; inset:0; z-index:-2; pointer-events:none;
  background:radial-gradient(120% 90% at 50% 40%, transparent 40%, rgba(2,4,9,.75) 100%);
}

/* --------------------------------------------------------------------------
   Layout
   -------------------------------------------------------------------------- */
.wrap{width:min(100% - 40px, 960px); margin-inline:auto;}
.center{text-align:center;}

/* --------------------------------------------------------------------------
   Hero
   -------------------------------------------------------------------------- */
.hero{padding:62px 0 12px;}
.eyebrow{
  display:inline-flex; align-items:center; gap:9px;
  margin:0 0 22px;
  padding:8px 16px;
  border:1px solid rgba(47,140,255,.35);
  border-radius:999px;
  background:rgba(47,140,255,.08);
  box-shadow:0 0 34px -10px rgba(47,140,255,.6) inset;
  font-family:var(--font-head);
  font-size:.72rem; font-weight:600; letter-spacing:.16em; text-transform:uppercase;
  color:#BFD9FF;
}
.eyebrow .dot{
  width:7px; height:7px; border-radius:50%;
  background:var(--blue-light);
  box-shadow:0 0 0 4px rgba(111,195,255,.18);
  animation:blink 2.4s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1;} 50%{opacity:.35;}}

h1{
  font-family:var(--font-head);
  font-size:clamp(1.8rem, 5.4vw, 3.85rem);
  font-weight:700;
  line-height:1.09;
  letter-spacing:-.025em;
  margin:0 0 20px;
  text-wrap:balance;
}
.accent{
  color:var(--blue-light);
  text-shadow:0 0 42px rgba(47,140,255,.55);
}
.underline{
  position:relative;
  white-space:nowrap;
}
.underline::after{
  content:"";
  position:absolute; left:0; right:0; bottom:.1em;
  height:.06em; border-radius:2px;
  background:linear-gradient(90deg, var(--blue-light), var(--blue));
  box-shadow:0 0 18px rgba(47,140,255,.7);
}
.hero-sub{
  max-width:640px; margin:0 auto;
  color:var(--text-muted);
  font-size:clamp(1rem, 1.6vw, 1.12rem);
}
.hero-sub strong{color:var(--text); font-weight:500;}

/* --------------------------------------------------------------------------
   Steps
   -------------------------------------------------------------------------- */
.step{padding:44px 0 0;}
.step-head{margin:0 0 18px;}
.step-title{
  font-family:var(--font-head);
  font-size:clamp(1.15rem, 2.4vw, 1.5rem);
  font-weight:600; letter-spacing:-.01em;
  margin:14px 0 0;
}

.trust{
  display:flex; flex-wrap:wrap; justify-content:center; gap:8px 22px;
  margin:26px 0 0; padding:0; list-style:none;
  color:var(--text-faint); font-size:.88rem;
}
.trust li{display:flex; align-items:center; gap:8px;}
.trust svg{width:15px; height:15px; color:var(--blue);}

/* Buttons ---------------------------------------------------------------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:10px;
  padding:15px 30px;
  border:0; border-radius:10px;
  font-family:var(--font-body); font-size:1rem; font-weight:700;
  text-decoration:none; cursor:pointer;
  transition:transform .2s var(--ease), box-shadow .2s var(--ease), background .2s var(--ease);
}
.btn-primary{
  background:var(--blue); color:#fff;
  box-shadow:0 14px 40px -14px rgba(47,140,255,.95);
}
.btn-primary:hover{background:#4C9DFF; transform:translateY(-2px); box-shadow:0 20px 50px -14px rgba(47,140,255,1);}
.btn-ghost{
  background:rgba(255,255,255,.04); color:var(--text);
  border:1px solid var(--border);
}
.btn-ghost:hover{background:rgba(255,255,255,.08); transform:translateY(-2px);}
.btn-lg{padding:17px 40px; font-size:1.05rem;}

/* Calendar --------------------------------------------------------------- */
#calendar{scroll-margin-top:24px;}
.cal-card{
  margin-top:6px;
  padding:10px;
  border-radius:var(--radius);
  background:linear-gradient(180deg, rgba(20,32,56,.75), rgba(9,14,26,.75));
  border:1px solid var(--border);
  box-shadow:0 40px 90px -50px rgba(47,140,255,.6), 0 24px 60px -30px rgba(0,0,0,.9);
}
.cal-inner{
  border-radius:calc(var(--radius) - 8px);
  overflow:hidden;
  background:#0A0F1C;
}
/* Tall enough that the whole booking card fits with no scrollbar inside the
   iframe; data-resize lets Calendly trim it to the exact content height. */
.calendly-inline-widget{min-width:280px; height:1200px; min-height:700px;}

/* --------------------------------------------------------------------------
   Bottom CTA
   -------------------------------------------------------------------------- */
.cta{
  position:relative;
  /* Full bleed: breaks out of any max-width container the page is dropped
     into (GoHighLevel, a page builder, a themed site) so the blue always
     runs edge to edge. Harmless on a plain full-width page. */
  margin-left:calc(50% - 50vw);
  margin-right:calc(50% - 50vw);
  width:auto;
  margin-top:86px;
  padding:86px 0 92px;
  overflow:hidden;
  background:
    radial-gradient(115% 130% at 100% 50%, rgba(38,124,255,.95) 0%, rgba(20,74,190,.75) 22%, rgba(9,32,92,.35) 45%, rgba(4,7,14,0) 68%),
    linear-gradient(90deg, #04060D 0%, #050A16 45%, #061027 100%);
  border-top:1px solid rgba(47,140,255,.18);
}
.cta::before{
  content:"";
  position:absolute; inset:0;
  background:radial-gradient(70% 90% at 0% 50%, rgba(2,3,8,.9) 0%, rgba(2,3,8,0) 60%);
  pointer-events:none;
}
.cta > .wrap{position:relative;}
/* Sized off the wordmark so the mark keeps the brand lockup's proportions
   (the icon is roughly 3x the cap height of the type) at every breakpoint. */
.cta-lockup{
  display:flex; align-items:center; justify-content:center;
  gap:.62em; margin:0 0 44px;
  font-size:clamp(1.6rem, 3.2vw, 2.15rem);
}
.cta-lockup img{height:2.1em; width:auto;}
.cta-wordmark{
  font-family:var(--font-head);
  font-size:1em;
  font-weight:600; letter-spacing:-.02em;
  color:#fff;
}
.cta h2{
  font-family:var(--font-head);
  font-size:clamp(1.9rem, 4.6vw, 3.15rem);
  font-weight:700; line-height:1.1; letter-spacing:-.025em;
  margin:0 0 26px;
  text-wrap:balance;
}
.cta p{
  margin:0 0 42px;
  color:rgba(255,255,255,.82);
  font-size:1rem;
}

/* --------------------------------------------------------------------------
   Footer
   -------------------------------------------------------------------------- */
.footer{
  /* Full bleed too, so its top border matches the CTA above it. */
  margin-left:calc(50% - 50vw);
  margin-right:calc(50% - 50vw);
  padding:30px 0 38px;
  color:var(--text-faint);
  font-size:.84rem;
  border-top:1px solid rgba(255,255,255,.05);
}

/* --------------------------------------------------------------------------
   Reveal on scroll
   -------------------------------------------------------------------------- */
/* Hidden only once JS has confirmed it can reveal them again — so the page is
   never blank if the script fails to run. */
.js .reveal{opacity:0; transform:translateY(20px); transition:opacity .7s var(--ease), transform .7s var(--ease);}
.js .reveal.is-in{opacity:1; transform:none;}

@media (max-width:760px){
  .calendly-inline-widget{height:1450px;}
  .cta{margin-top:64px; padding:66px 0 72px;}
  .cta-lockup{margin-bottom:34px;}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
  .js .reveal{opacity:1; transform:none;}
}

/* ===================== CRM ===================== */
:root{ --good:#34D399; --warn:#F5A524; --bad:#F87171; --violet:#A78BFA; }
html{scrollbar-width:auto;}
body{background:transparent; min-height:100vh;}
html::-webkit-scrollbar, body::-webkit-scrollbar{width:10px; display:block;}
html::-webkit-scrollbar-thumb{background:#1C2942; border-radius:8px;}
.app{width:min(100% - 32px, 1240px); margin:0 auto; padding:24px 0 60px;}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:26px;}
.brand{display:flex; align-items:center; gap:12px; font-family:var(--font-head); font-weight:600; font-size:1.2rem;}
.brand img{height:36px; width:auto;}
.brand small{font-family:var(--font-body); font-weight:500; font-size:.8rem; color:var(--text-faint); border:1px solid var(--border); padding:3px 9px; border-radius:99px;}
.who{display:flex; align-items:center; gap:12px; color:var(--text-faint); font-size:.88rem;}
.btn-sm{padding:9px 16px; font-size:.88rem; border-radius:9px;}
.panel{background:linear-gradient(180deg, rgba(20,32,56,.7), rgba(9,14,26,.8)); border:1px solid var(--border); border-radius:16px;}

/* Login */
.login{max-width:430px; margin:12vh auto 0; padding:36px; text-align:center;}
.login img{height:64px; margin:0 auto 14px;}
.login h1{font-size:1.7rem; margin:0 0 8px;}
.login p{color:var(--text-muted); margin:0 0 22px;}
.login form{display:grid; gap:12px; text-align:left;}
.login label{font-size:.88rem; color:var(--text-muted);}
.input, select.input, textarea.input{font:inherit; color:var(--text); background:rgba(255,255,255,.03); border:1px solid var(--border); border-radius:10px; padding:12px 14px; width:100%;}
.input:focus{outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(47,140,255,.2);}
select.input option{background:#0B1120;}
.msg{font-size:.9rem; min-height:1.2em; margin:4px 0 0;}
.msg.ok{color:var(--good);} .msg.err{color:var(--bad);}

/* Stats */
.stats{display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:12px; margin-bottom:18px;}
.stat{padding:16px 18px;}
.stat .k{font-size:.78rem; color:var(--text-faint); text-transform:uppercase; letter-spacing:.1em; font-family:var(--font-head);}
.stat .v{font-family:var(--font-head); font-size:1.8rem; font-weight:700; margin-top:4px; font-variant-numeric:tabular-nums;}
@media (max-width:900px){ .stats{grid-template-columns:repeat(2, minmax(0,1fr));} }

/* Toolbar */
.toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:14px;}
.toolbar .search{flex:1 1 260px;}
.toolbar select{flex:0 0 180px;}
@media (max-width:600px){ .toolbar select{flex:1 1 100%;} }

/* Table */
.table-wrap{overflow-x:auto;}
table{width:100%; border-collapse:collapse; font-size:.92rem;}
th{font-family:var(--font-head); font-weight:600; font-size:.74rem; letter-spacing:.1em; text-transform:uppercase; color:var(--text-faint); text-align:left; padding:14px 16px; border-bottom:1px solid var(--border); white-space:nowrap;}
td{padding:14px 16px; border-bottom:1px solid rgba(28,41,66,.6); vertical-align:middle;}
tbody tr{cursor:pointer; transition:background .15s;}
tbody tr:hover{background:rgba(47,140,255,.06);}
tbody tr:last-child td{border-bottom:0;}
td .nm{font-weight:700;} td .sub{color:var(--text-faint); font-size:.84rem;}
.score{display:inline-grid; place-items:center; min-width:44px; padding:4px 8px; border-radius:8px; font-family:var(--font-head); font-weight:700; font-variant-numeric:tabular-nums;}
.pill{display:inline-block; padding:4px 10px; border-radius:99px; font-size:.8rem; font-weight:700; white-space:nowrap; border:1px solid currentColor;}
.empty{padding:50px 20px; text-align:center; color:var(--text-muted);}
.hide-sm{} @media (max-width:760px){ .hide-sm{display:none;} }

/* Drawer */
.scrim{position:fixed; inset:0; background:rgba(2,4,9,.6); backdrop-filter:blur(2px); z-index:20; opacity:0; pointer-events:none; transition:opacity .2s;}
.scrim.on{opacity:1; pointer-events:auto;}
.drawer{position:fixed; top:0; right:0; bottom:0; width:min(560px, 100%); z-index:21; background:#070B16; border-left:1px solid var(--border); transform:translateX(100%); transition:transform .25s var(--ease); overflow-y:auto; padding:26px;}
.drawer.on{transform:none;}
.drawer h2{font-family:var(--font-head); font-size:1.5rem; margin:0;}
.drawer .close{position:absolute; top:18px; right:18px;}
.dl{display:grid; grid-template-columns:130px 1fr; gap:8px 14px; font-size:.93rem; margin:18px 0;}
.dl dt{color:var(--text-faint);} .dl dd{margin:0; word-break:break-word;}
.dl a{color:var(--blue-light);}
.sec{margin-top:24px;}
.sec h3{font-family:var(--font-head); font-size:.8rem; letter-spacing:.12em; text-transform:uppercase; color:var(--text-faint); margin:0 0 12px; font-weight:600;}
.bars{display:grid; gap:10px;}
.bars .r{display:grid; grid-template-columns:1fr 44px; gap:4px 10px; font-size:.88rem;}
.bars .r b{text-align:right;}
.bars .t{grid-column:1/-1; height:6px; border-radius:9px; background:rgba(255,255,255,.06); overflow:hidden;}
.bars .t i{display:block; height:100%; border-radius:9px;}
.ans{display:grid; gap:8px; margin:0; padding:0; list-style:none;}
.ans li{padding:10px 12px; border-radius:10px; background:rgba(255,255,255,.025); border:1px solid rgba(28,41,66,.7); font-size:.88rem;}
.ans li .q{color:var(--text-faint);} .ans li .a{font-weight:500; margin-top:2px; display:flex; justify-content:space-between; gap:10px;}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
.danger{background:transparent; color:var(--bad); border:1px solid rgba(248,113,113,.4);}
.danger:hover{background:rgba(248,113,113,.08);}
.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); background:#0F1A30; border:1px solid var(--border); padding:10px 18px; border-radius:10px; font-size:.9rem; opacity:0; transition:all .2s; z-index:30; pointer-events:none;}
.toast.on{opacity:1; transform:translateX(-50%);}
[hidden]{display:none !important;}
</style>
</head>
<body>
<div class="bg-layer" aria-hidden="true"></div>

<!-- Lead drawer -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Lead details" role="dialog" aria-modal="true"></aside>
<div class="toast" id="toast" role="status"></div>

<script>
/* ======================= SETTINGS ======================= */
const SUPABASE_URL = "https://ccraoamkqgtzdafsyduc.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNjcmFvYW1rcWd0emRhZnN5ZHVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU2OTE0MTcsImV4cCI6MjExMTI2NzQxN30.DcjNeI0_a1LaKbAUvVcAy4G09vNF_B-6n2XKWPl7PDw";   // public "anon" key: safe to publish, the database rules do the protecting
/* ======================================================== */

const STATUSES = ["New", "Contacted", "Call booked", "Won", "Lost"];
const STATUS_COLOR = { "New": "var(--blue-light)", "Contacted": "var(--warn)", "Call booked": "var(--violet)", "Won": "var(--good)", "Lost": "var(--text-faint)" };
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let leads = [], openId = null;

const fmtDate = d => new Date(d).toLocaleString("en-GB", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
const scoreColor = s => s >= 70 ? "var(--good)" : s >= 40 ? "var(--blue-light)" : "var(--warn)";
const scoreBg = s => s >= 70 ? "rgba(52,211,153,.12)" : s >= 40 ? "rgba(47,140,255,.14)" : "rgba(245,165,36,.12)";
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 2200); }

/* ---------- Auth ---------- */
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  show(session);
  sb.auth.onAuthStateChange((_e, s) => show(s));
}
function show(session) {
  $("loginView").hidden = !!session;
  $("appView").hidden = !session;
  if (session) { $("whoEmail").textContent = session.user.email; if (!show.loaded) { show.loaded = true; load(); } }
  else show.loaded = false;
}
$("loginForm").onsubmit = async e => {
  e.preventDefault();
  const msg = $("loginMsg"), email = $("loginEmail").value.trim();
  msg.className = "msg"; msg.textContent = "Sending…";
  const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: false, emailRedirectTo: location.origin + location.pathname } });
  if (error) { msg.className = "msg err"; msg.textContent = "That email isn’t allowed, or too many attempts. Try again shortly."; return; }
  msg.className = "msg ok"; msg.textContent = "Check your inbox and click the login link.";
};
$("signOut").onclick = async () => { await sb.auth.signOut(); leads = []; closeDrawer(); };

/* ---------- Data ---------- */
async function load() {
  $("refresh").disabled = true;
  const { data, error } = await sb.from("leads").select("*").order("created_at", { ascending: false });
  $("refresh").disabled = false;
  if (error) { toast("Couldn’t load leads: " + error.message); return; }
  leads = data || [];
  if (!leads.length && !(await isAdmin())) { $("empty").hidden = false; $("empty").textContent = "This account isn’t an admin, so no leads are shown."; }
  render();
}
async function isAdmin() { const { data } = await sb.rpc("is_crm_admin"); return !!data; }

async function patch(id, fields) {
  const { error } = await sb.from("leads").update(fields).eq("id", id);
  if (error) { toast("Save failed: " + error.message); return false; }
  Object.assign(leads.find(l => l.id === id), fields);
  render(); return true;
}

/* ---------- List ---------- */
STATUSES.forEach(s => $("fStatus").insertAdjacentHTML("beforeend", `<option>${s}</option>`));
$("q").oninput = render; $("fStatus").onchange = render; $("refresh").onclick = load;

function render() {
  const q = $("q").value.trim().toLowerCase(), f = $("fStatus").value;
  const list = leads.filter(l => (!f || l.status === f) &&
    (!q || [l.first_name, l.email, l.phone, l.company, l.business_type].some(v => (v || "").toLowerCase().includes(q))));
  const week = Date.now() - 7 * 864e5;
  $("sTotal").textContent = leads.length;
  $("sWeek").textContent = leads.filter(l => new Date(l.created_at) > week).length;
  $("sNew").textContent = leads.filter(l => l.status === "New").length;
  $("sBooked").textContent = leads.filter(l => l.status === "Call booked").length;
  $("sWon").textContent = leads.filter(l => l.status === "Won").length;

  $("rows").innerHTML = list.map(l => `
    <tr data-id="${l.id}" tabindex="0">
      <td><div class="nm">${esc(l.first_name)}</div><div class="sub">${esc(l.company || "")}</div></td>
      <td class="hide-sm"><div>${esc(l.email)}</div><div class="sub">${esc(l.phone || "")}</div></td>
      <td><span class="score" style="color:${scoreColor(l.score)};background:${scoreBg(l.score)}">${l.score ?? "–"}</span></td>
      <td><span class="pill" style="color:${STATUS_COLOR[l.status]}">${esc(l.status)}</span></td>
      <td class="hide-sm"><div>${esc(l.business_type || "")}</div><div class="sub">${esc(l.monthly_leads ? l.monthly_leads + " leads/mo" : "")}</div></td>
      <td class="sub">${fmtDate(l.created_at)}</td>
    </tr>`).join("");
  const empty = $("empty");
  empty.hidden = list.length > 0;
  if (!list.length) empty.textContent = leads.length ? "No leads match your search." : "No leads yet. They’ll appear here as soon as someone completes the diagnostic.";
  $("rows").querySelectorAll("tr").forEach(tr => {
    tr.onclick = () => openDrawer(tr.dataset.id);
    tr.onkeydown = e => { if (e.key === "Enter") openDrawer(tr.dataset.id); };
  });
  if (openId) { const l = leads.find(x => x.id === openId); if (!l) closeDrawer(); }
}

/* ---------- Drawer ---------- */
function openDrawer(id) {
  const l = leads.find(x => x.id === id); if (!l) return;
  openId = id;
  const cats = l.category_scores || {};
  const answers = Array.isArray(l.answers) ? l.answers : [];
  $("drawer").innerHTML = `
    <button class="btn btn-ghost btn-sm close" id="dClose" aria-label="Close">✕</button>
    <h2>${esc(l.first_name)}</h2>
    <div class="sub" style="color:var(--text-faint);margin-top:4px">${esc(l.company || "")} · submitted ${fmtDate(l.created_at)}</div>
    <dl class="dl">
      <dt>Email</dt><dd><a href="mailto:${esc(l.email)}">${esc(l.email)}</a></dd>
      <dt>Phone</dt><dd>${l.phone ? `<a href="tel:${esc(l.phone)}">${esc(l.phone)}</a>` : "–"}</dd>
      <dt>Business type</dt><dd>${esc(l.business_type || "–")}</dd>
      <dt>Leads per month</dt><dd>${esc(l.monthly_leads || "–")}</dd>
      <dt>Score</dt><dd><span class="score" style="color:${scoreColor(l.score)};background:${scoreBg(l.score)}">${l.score ?? "–"}</span> &nbsp;${esc(l.band || "")}</dd>
    </dl>
    <div class="sec">
      <h3>Pipeline</h3>
      <div class="row">
        <select class="input" id="dStatus" style="flex:1 1 200px">${STATUSES.map(s => `<option ${s === l.status ? "selected" : ""}>${s}</option>`).join("")}</select>
      </div>
      <textarea class="input" id="dNotes" rows="5" placeholder="Notes: calls, follow-ups, what they said…" style="margin-top:10px;resize:vertical">${esc(l.notes || "")}</textarea>
      <div class="row" style="margin-top:10px;justify-content:space-between">
        <button class="btn btn-primary btn-sm" id="dSave">Save notes</button>
        <button class="btn danger btn-sm" id="dDelete">Delete lead</button>
      </div>
    </div>
    <div class="sec">
      <h3>Scores by area</h3>
      <div class="bars">${Object.entries(cats).map(([k, v]) => `
        <div class="r"><span>${esc(k)}</span><b>${v}%</b><div class="t"><i style="width:${Number(v) || 0}%;background:${scoreColor(v)}"></i></div></div>`).join("") || "<span class='sub'>–</span>"}
      </div>
    </div>
    <div class="sec">
      <h3>Their answers</h3>
      <ul class="ans">${answers.map(a => `
        <li><div class="q">${esc(a.question)}</div><div class="a"><span>${esc(a.answer)}</span><span style="color:${scoreColor((a.points || 0) / 3 * 100)}">${a.points}/3</span></div></li>`).join("")}
      </ul>
    </div>`;
  $("scrim").classList.add("on"); $("drawer").classList.add("on");
  $("dClose").onclick = closeDrawer;
  $("dStatus").onchange = async e => { if (await patch(id, { status: e.target.value })) toast("Status updated"); };
  $("dSave").onclick = async () => { if (await patch(id, { notes: $("dNotes").value })) toast("Notes saved"); };
  $("dDelete").onclick = async () => {
    if (!confirm(`Permanently delete ${l.first_name} (${l.email})? This can’t be undone.`)) return;
    const { error } = await sb.from("leads").delete().eq("id", id);
    if (error) return toast("Delete failed: " + error.message);
    leads = leads.filter(x => x.id !== id); closeDrawer(); render(); toast("Lead deleted");
  };
  $("dClose").focus();
}
function closeDrawer() { openId = null; $("scrim").classList.remove("on"); $("drawer").classList.remove("on"); }
$("scrim").onclick = closeDrawer;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

/* ---------- CSV ---------- */
$("export").onclick = () => {
  const cols = ["created_at", "first_name", "email", "phone", "company", "business_type", "monthly_leads", "score", "band", "status", "notes"];
  const cell = v => { v = v == null ? "" : String(v); if (/^[=+\-@]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; };
  const csv = [cols.join(","), ...leads.map(l => cols.map(c => cell(l[c])).join(","))].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" }));
  a.download = `everythingai-leads-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
};

window.addEventListener("focus", () => { if (show.loaded) load(); });
boot();
</script>
</body>
</html>
